# Static site. The app is a set of files; there is no API and nothing is stored on the server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Always revalidate, so a rebuilt image takes effect on the next page load (ETags keep it cheap).
    add_header Cache-Control "no-cache" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Scripts: own files plus the pinned, integrity-checked libraries on cdnjs. No inline scripts, no eval.
    # Styles need 'unsafe-inline' because document themes are set through style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # Routing is hash-based (#documents, #edit-<id>), so every real path is a file. Unknown paths are 404s.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
