name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (served by scripts/serve.mjs)
        run: npm run test:e2e
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: A throwaway database password for this run
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
      - name: Build and start (web, api, db)
        run: docker compose up -d --build --wait
      - name: Smoke test (status codes, content types, security headers)
        run: |
          set -euo pipefail
          base=http://localhost:8090
          check() { # path, expected status, expected content type prefix
            local out code type
            out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$base$1")
            code=${out%% *}
            type=${out#* }
            echo "$1 -> $code $type"
            [ "$code" = "$2" ] || { echo "expected status $2"; exit 1; }
            case "$type" in "$3"*) ;; *) echo "expected type $3"; exit 1 ;; esac
          }
          check /               200 text/html
          check /js/app.js      200 application/javascript
          check /css/styles.css 200 text/css
          check /healthz        200 text/plain
          check /nope           404 text/html
          check /js/profile.local.js 404 text/html   # private details are never in a CI-built image
          check /api/health     200 application/json  # nginx passes /api/ to the api container
          check /api/auth/me    200 application/json
          check /api/docs       401 application/json  # documents need a session
          [ "$(curl -s "$base/api/tailor")" = '{"providers":{"claude":false,"openai":false}}' ] || { echo "no AI keys expected in CI"; exit 1; }
          headers=$(curl -sI "$base/")
          for h in content-security-policy x-content-type-options x-frame-options referrer-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "missing header $h"; exit 1; }
          done
          [ "$(docker exec craftfolio id -u)" != "0" ] || { echo "container runs as root"; exit 1; }
          [ "$(docker exec craftfolio-api id -u)" != "0" ] || { echo "api container runs as root"; exit 1; }
          [ -z "$(docker port craftfolio-db)" ] || { echo "the database must not be published on the host"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests against the container (checks the CSP does not break the app)
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:8090
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down
